name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      # Only bootstraps pnpm: devEngines in package.json makes pnpm download
      # and use the pinned pnpm and Node versions.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --global pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm test
